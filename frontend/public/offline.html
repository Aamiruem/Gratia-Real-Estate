<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#142536" />
  <meta name="robots" content="noindex" />
  <title>You're offline | Gratia Estates</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 15% 0%, rgba(201,164,92,.25), transparent 50%), #142536;
      color: #fff;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
    h1 { font-family: Poppins, system-ui, sans-serif; font-size: 28px; margin: 24px 0 8px; }
    p { color: rgba(255,255,255,.82); line-height: 1.6; margin: 0 0 24px; }
    .actions { display: grid; gap: 12px; }
    button, a {
      display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
      border-radius: 999px; font: 700 15px/1 inherit; text-decoration: none; cursor: pointer; border: 0;
    }
    button { background: #c9a45c; color: #142536; }
    a { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); }
    small { display: block; margin-top: 24px; color: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Gratia Estates" />
    <h1>You're offline</h1>
    <p>This page isn't saved on your device yet. Check your internet connection and try again. Pages you've visited before still open offline.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="tel:+919109776155">Call an advisor: +91 91097 76155</a>
    </div>
    <small>Gratia Estates · Gurgaon &amp; Delhi-NCR</small>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
