# Render blueprint for the API + PostgreSQL (Render → New → Blueprint → this repo).
# After it deploys, copy the API URL into Vercel as BACKEND_URL.
# Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: gratia-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: gratia-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: OTP_CONSOLE_FALLBACK
        value: "false"
      - key: VIDEO_ADMIN_EMAIL
        sync: false
      - key: OWNER_PHONE_NUMBER
        sync: false
      # Email OTP: Render blocks SMTP on free instances, so Resend is easiest.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Mobile OTP via Fast2SMS (India).
      - key: SMS_PROVIDER
        value: fast2sms
      - key: FAST2SMS_API_KEY
        sync: false
      # WhatsApp OTP via Meta's approved authentication template.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        value: en
      - key: WHATSAPP_TEMPLATE_BUTTON
        value: "true"
      # Public site address (links in owner alerts) and CORS for direct calls.
      - key: PUBLIC_SITE_URL
        value: https://www.gratiaestates.com
      - key: FRONTEND_ORIGINS
        value: https://www.gratiaestates.com,https://gratiaestates.com
      # Owner phone alerts for new leads (ntfy app; long random topic name).
      - key: NTFY_TOPIC
        sync: false
      # Browser push notifications: generate with `python -m app.push`.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # AI chat assistant (OpenAI / ChatGPT API). Leave empty to use built-in answers.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # Vercel -> Project -> Settings -> Git -> Deploy Hooks: rebuilds the sitemap
      # when properties change in the admin panel.
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false

databases:
  - name: gratia-db
    plan: free
